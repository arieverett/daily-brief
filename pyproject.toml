[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-brief"
version = "0.1.0"
description = "A personal daily Sweden + Indonesia email briefing"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11,<7",
  "httpx[socks]>=0.27,<1",
  "jinja2>=3.1,<4",
  "openai>=1.54,<3",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
daily-brief = "briefing.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefing = ["templates/*.html", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
