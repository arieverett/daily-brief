  # ANTARA is Indonesia's national news agency and publishes an official English RSS feed.
  # (The old per-section feeds under /rss/*.xml were removed by ANTARA and returned 404.)
  - name: ANTARA — English news
    source: ANTARA
    country: Indonesia
    url: "https://en.antaranews.com/rss/news.xml"

