  # can't empty the edition. Checked working from GitHub Actions on 2026-09-29.
  - name: The Local Sweden
    source: The Local Sweden
    country: Sweden
    tier: backup
    url: "https://www.thelocal.se/feeds/rss.php"
  - name: Radio Sweden (English)
    source: Sveriges Radio
    country: Sweden
