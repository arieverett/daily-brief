# Two-Mile High: the US regional edition (Phoenix + Denver). Same pipeline as the other
# editions. Each region is a news section; a feed's `country` names the region it fills.
# Add a region here (and feeds for it) to extend the edition to another city.
edition:
  name: us
  title: Two-Mile High
  kicker: Your daily Phoenix + Denver brief
  intro: Here is what matters today in Phoenix and Denver, without the filler.
  footer: Coded by Ari with <3 to educate, inform, and enable.
  accent: "#c2410c"
  regions:
    - key: phoenix
      name: Phoenix
      state: Arizona
      emoji: "🌵"
      focus: >-
        The Phoenix metro (Phoenix, Tempe, Scottsdale, Mesa, Chandler, Gilbert, Glendale) first,
        then Arizona statewide: state government, water, growth, the economy, ASU, local sports,
        food and culture.
    - key: denver
      name: Denver
      state: Colorado
      emoji: "🏔️"
      focus: >-
        Denver and the Front Range (Aurora, Lakewood, Boulder) first, then Colorado statewide:
        state government, housing, the economy, the mountains and outdoors, local sports, food
        and culture.

feeds:
  - name: Google News — Phoenix
    country: Phoenix
    url: "https://news.google.com/rss/search?q=%22Phoenix%22%20%28Arizona%20OR%20AZ%20OR%20Valley%29%20when%3A2d&hl=en-US&gl=US&ceid=US%3Aen"
    allowed_sources: &phoenix_sources
