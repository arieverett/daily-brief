# Weekly dependency updates as one grouped PR per ecosystem. The Test workflow runs on
# each PR; merge it when green. Until merged, production keeps the locked versions.
#
# Major versions are ignored on purpose: the tests can't exercise the real OpenAI API or
# the real delivery workflows, so a major upgrade should be a deliberate change, not a
# weekly bump.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
