name: Reusable newsletter delivery

on:
  workflow_call:
    inputs:
      edition:
        description: Newsletter edition to generate (standard or indonesia)
        required: true
        type: string
      force:
        description: Skip the day/duplicate checks and send immediately (manual revisions)
        required: false
        default: false
        type: boolean
      trigger:
        description: What started this run, for logs and failure alerts
        required: false
        default: manual
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      RESEND_API_KEY:
        required: true
      BRIEF_FROM_EMAIL:
        required: true
      BRIEF_TO_EMAIL:
        required: true
      INDONESIA_BRIEF_TO_EMAIL:
        required: false

jobs:
  send:
    name: Send ${{ inputs.edition }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One delivery per edition at a time, whichever workflow started it. A run that
    # queues behind another re-checks the delivery record below and skips if the
    # first one already delivered.
    concurrency:
      group: deliver-${{ inputs.edition }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5

      - name: Check whether today's edition still needs sending
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(gate --editions "${{ inputs.edition }}")
          if [[ "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          python3 -m briefing.delivery "${args[@]}"

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.any == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application
        if: steps.guard.outputs.any == 'true'
        run: pip install .

      - name: Generate and send newsletter
        if: steps.guard.outputs.any == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRIMARY_TO_EMAIL: ${{ secrets.BRIEF_TO_EMAIL }}
          INDONESIA_TO_EMAIL: ${{ secrets.INDONESIA_BRIEF_TO_EMAIL }}
          BRIEF_FROM_EMAIL: ${{ secrets.BRIEF_FROM_EMAIL }}
          BRIEF_TIMEZONE: America/New_York
          BRIEF_MAX_CANDIDATES: ${{ inputs.edition == 'indonesia' && '60' || '40' }}
          BRIEF_EDITION_DATE: ${{ steps.guard.outputs.date }}
          # Automatic runs are handed to Resend to land at exactly 06:00 New York time
          # (or immediately if it is already past 06:00).
          BRIEF_SEND_AT: ${{ !inputs.force && '06:00' || '' }}
          # Automatic attempts share one Resend idempotency key per edition and day.
          # Forced revisions get a unique run nonce so they can be sent intentionally.
          BRIEF_DELIVERY_NONCE: ${{ inputs.force && github.run_id || '' }}
        shell: bash
        run: |
          if [[ "${{ inputs.edition }}" == "indonesia" ]]; then
            export BRIEF_TO_EMAIL="${INDONESIA_TO_EMAIL},${PRIMARY_TO_EMAIL}"
            sources="config/indonesia_sources.yml"
          else
            export BRIEF_TO_EMAIL="${PRIMARY_TO_EMAIL}"
            sources="config/sources.yml"
          fi
          echo "Trigger: ${{ inputs.trigger }}"
          python -m briefing --send --edition "${{ inputs.edition }}" --sources "$sources"

      # The delivery record that every later run checks. Forced revisions don't count
      # as the day's delivery. A failed upload must not fail the job (the email is
      # already out); a later run would just hit Resend's duplicate guard.
      - name: Record delivery
        if: success() && steps.guard.outputs.any == 'true' && !inputs.force
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: delivered-${{ inputs.edition }}-${{ steps.guard.outputs.date }}
          path: out/delivery/${{ inputs.edition }}.json
          retention-days: 7
          if-no-files-found: error

      - name: Email a failure alert
        id: alert
        if: failure() && !inputs.force
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_FROM_EMAIL: ${{ secrets.BRIEF_FROM_EMAIL }}
          ALERT_TO_EMAIL: ${{ secrets.BRIEF_TO_EMAIL }}
        shell: bash
        run: |
          python3 -m briefing.delivery alert \
            --edition "${{ inputs.edition }}" \
            --date "${{ steps.guard.outputs.date }}" \
            --trigger "${{ inputs.trigger }}"

      - name: Record alert
        if: failure() && steps.alert.outputs.sent == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.alert.outputs.record }}
          path: out/alert/alert.json
          retention-days: 7
