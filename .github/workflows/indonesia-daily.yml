name: Send Indonesia brief

on:
  schedule:
    # Redundant recovery attempts. The primary 06:00 America/New_York trigger
    # is external and updates .github/run-briefs-now. Two off-peak retries make
    # a dropped/delayed GitHub cron far less likely to miss the edition.
    - cron: "7 6 * * 1-6"
      timezone: "America/New_York"
    - cron: "22 6 * * 1-6"
      timezone: "America/New_York"
  workflow_dispatch:
  push:
    paths:
      - ".github/run-briefs-now"
      - ".github/run-indonesia-now"

concurrency:
  group: indonesia-daily-brief
  cancel-in-progress: false

jobs:
  send:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/send-newsletter.yml
    with:
      edition: indonesia
      sources: config/indonesia_sources.yml
      max_candidates: "60"
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BRIEF_FROM_EMAIL: ${{ secrets.BRIEF_FROM_EMAIL }}
      BRIEF_TO_EMAIL: ${{ secrets.BRIEF_TO_EMAIL }}
      INDONESIA_BRIEF_TO_EMAIL: ${{ secrets.INDONESIA_BRIEF_TO_EMAIL }}
