name: Send daily brief

on:
  schedule:
    # GitHub cron uses UTC. The reusable workflow selects the correct
    # New York offset for daylight or standard time.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/run-briefs-now"
      - ".github/run-standard-now"

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  send:
    uses: ./.github/workflows/send-newsletter.yml
    with:
      edition: standard
      sources: config/sources.yml
      max_candidates: "40"
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BRIEF_FROM_EMAIL: ${{ secrets.BRIEF_FROM_EMAIL }}
      BRIEF_TO_EMAIL: ${{ secrets.BRIEF_TO_EMAIL }}
