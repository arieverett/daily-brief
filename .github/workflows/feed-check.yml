name: Feed check

# Fetches every configured feed from GitHub's network (the same place the morning run
# fetches from) whenever the feed list or collection code changes, and on demand.
# A dead feed shows as a warning; a country left with too few stories to publish fails.
# It also fetches both editions' weather (forecasts + climate history) the same way.

on:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "src/briefing/collect.py"
      - "src/briefing/feedcheck.py"
      - "src/briefing/weather.py"
      - "src/briefing/weather_topics.py"
      - ".github/workflows/feed-check.yml"
  pull_request:
    paths:
      - "config/**"
      - "src/briefing/collect.py"
      - "src/briefing/feedcheck.py"
      - "src/briefing/weather.py"
      - "src/briefing/weather_topics.py"
  workflow_dispatch:

jobs:
  # Its own job: GitHub keeps at most 50 annotations per job, and the weather notices
  # below would otherwise crowd out this edition's feed report.
  us-feeds:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: US edition feeds
        run: uv run --no-sync python -m briefing.feedcheck config/us_sources.yml --max-candidates 40

  feeds:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Standard edition feeds
        run: uv run --no-sync python -m briefing.feedcheck config/sources.yml --max-candidates 40
      - name: Indonesia edition feeds
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync python -m briefing.feedcheck config/indonesia_sources.yml
          --max-candidates 60
      # Same yearly climate-history cache idea as the morning run (it's a big download that
      # Open-Meteo rate-limits), saved even if the check fails so partial progress is kept.
      - name: Weather cache key
        id: wxkey
        run: echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
      - name: Restore weather history
        id: wxcache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather
          key: weather-history-v1-check-${{ steps.wxkey.outputs.year }}-${{ hashFiles('config/*.yml') }}
          restore-keys: weather-history-v1-check-${{ steps.wxkey.outputs.year }}-
      - name: Weather
        if: ${{ !cancelled() }}
        env:
          BRIEF_WEATHER_CACHE: .cache/weather
        run: uv run --no-sync python -m briefing.weather config/sources.yml config/indonesia_sources.yml config/us_sources.yml
      - name: Save weather history
        if: ${{ !cancelled() && steps.wxcache.outputs.cache-hit != 'true' && hashFiles('.cache/weather/*.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/weather
          key: weather-history-v1-check-${{ steps.wxkey.outputs.year }}-${{ hashFiles('config/*.yml') }}-${{ github.run_id }}
