name: Feed check

# Fetches every configured feed from GitHub's network (the same place the morning run
# fetches from) whenever the feed list or collection code changes, and on demand.
# A dead feed shows as a warning; a country left with too few stories to publish fails.

on:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "src/briefing/collect.py"
      - "src/briefing/feedcheck.py"
  pull_request:
    paths:
      - "config/**"
      - "src/briefing/collect.py"
      - "src/briefing/feedcheck.py"
  workflow_dispatch:

jobs:
  feeds:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Standard edition feeds
        run: uv run --no-sync python -m briefing.feedcheck config/sources.yml --max-candidates 40
      - name: Indonesia edition feeds
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync python -m briefing.feedcheck config/indonesia_sources.yml
          --max-candidates 60
