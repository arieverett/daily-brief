name: Test

on:
  push:
    paths-ignore:
      - ".github/run-briefs-now"
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Same locked versions production installs, plus the dev tools.
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -m briefing --sample
